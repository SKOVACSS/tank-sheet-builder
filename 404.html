<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TankRounds has moved</title>
<link rel="canonical" href="https://tanks.stevenks.com/">
<meta name="robots" content="noindex">
<script>
// Forward to the new address, keeping everything after ? and # so old share links
// (#L=...) and printed QR codes (#s=A) still open the right layout or section.
var NEW = 'https://tanks.stevenks.com/' + location.search + location.hash;
var installed = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
if (!installed) location.replace(NEW);
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://tanks.stevenks.com/"></noscript>
<style>
  body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:48px 20px;background:#eef2f1;color:#14201f;text-align:center}
  a.btn{display:inline-block;margin-top:12px;padding:12px 22px;border-radius:8px;background:#0b6e69;color:#fff;text-decoration:none;font-weight:600}
  @media (prefers-color-scheme:dark){body{background:#0f1716;color:#e4ecea}a.btn{background:#3fb3aa;color:#06201e}}
</style>
</head>
<body>
<h1>TankRounds has moved</h1>
<p>The new address is <strong>tanks.stevenks.com</strong>. Your saved layout links and QR codes work there too.</p>
<p id="app-note" hidden>If TankRounds is on your home screen, open the new address and add it to your home screen again.</p>
<p><a class="btn" id="go" href="https://tanks.stevenks.com/">Open TankRounds</a></p>
<script>
document.getElementById('go').href = NEW;
// opened from an old home-screen icon: explain, then continue automatically
if (installed) { document.getElementById('app-note').hidden = false; setTimeout(function(){ location.replace(NEW); }, 6000); }
</script>
</body>
</html>
